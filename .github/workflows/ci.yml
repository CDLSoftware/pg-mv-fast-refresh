          apt-get -y install postgresql-17-cron
          sleep 5

      - name: Setup pg_cron
        run: |
          echo "shared_preload_libraries='pg_cron'" >> /var/lib/postgresql/data/postgresql.conf
          echo "cron.database_name='postgres'" >> /var/lib/postgresql/data/postgresql.conf
          su postgres -c "/usr/lib/postgresql/17/bin/pg_ctl -D /var/lib/postgresql/data restart"
          sleep 5

      - name: Configure environment
        run: |
          mkdir -p /builds/cheshire-datasystems/dba-team
          ln -sf $GITHUB_WORKSPACE /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner
          cp .pipeline_module_set_variables.sh module_set_variables.sh
          chown -R postgres:postgres $GITHUB_WORKSPACE
          chmod 777 -R $GITHUB_WORKSPACE

      - name: Run build
        run: |
          sudo -i -u postgres /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner/run_pipeline_checks.sh build

