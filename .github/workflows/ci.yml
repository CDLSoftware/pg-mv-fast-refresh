      - name: Run MV refresh
        run: |
          sudo -i -u postgres bash -c "cd $GITHUB_WORKSPACE && $GITHUB_WORKSPACE/run_pipeline_checks.sh test"

  module-destroy:
    name: Module Destroy
    runs-on: ubuntu-latest
    container:
      image: postgres:17.6
      env:
        POSTGRES_HOST_AUTH_METHOD: trust
      options: --user root

    steps:
