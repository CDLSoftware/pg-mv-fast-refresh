          ln -sf $GITHUB_WORKSPACE /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner
          cp .pipeline_module_set_variables.sh module_set_variables.sh
          chown -R postgres:postgres $GITHUB_WORKSPACE
          chmod 777 -R $GITHUB_WORKSPACE

      - name: Run build
        run: |
          sudo -i -u postgres /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner/run_pipeline_checks.sh build

      - name: Run MV refresh
        run: |
          sudo -i -u postgres /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner/run_pipeline_checks.sh test

  module-destroy:
    name: Module Destroy
    runs-on: ubuntu-latest
    container:
      image: postgres:17.6
      env:
        POSTGRES_HOST_AUTH_METHOD: trust
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
