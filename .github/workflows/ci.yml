name: CI - PostgreSQL 17.6 Fast Refresh Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_HOST_AUTH_METHOD: trust
  GITLAB_PATH: /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: postgres:17.6
      env:
        POSTGRES_HOST_AUTH_METHOD: trust
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get -q update
          apt-get -y -q install git python3 python3-dev python3-pip default-jre default-jdk sudo

      - name: Start PostgreSQL
        run: |
          mkdir -p /var/run/postgresql
          chown postgres:postgres /var/run/postgresql
          su postgres -c "/usr/lib/postgresql/17/bin/initdb -D /var/lib/postgresql/data"
          su postgres -c "/usr/lib/postgresql/17/bin/pg_ctl -D /var/lib/postgresql/data -l /var/lib/postgresql/logfile start"
          apt-get -y install postgresql-17-cron
          sleep 5

      - name: Setup pg_cron
        run: |
          echo "shared_preload_libraries='pg_cron'" >> /var/lib/postgresql/data/postgresql.conf
          echo "cron.database_name='postgres'" >> /var/lib/postgresql/data/postgresql.conf
          su postgres -c "/usr/lib/postgresql/17/bin/pg_ctl -D /var/lib/postgresql/data restart"
          sleep 5

      - name: Configure environment
        run: |
          mkdir -p /builds/cheshire-datasystems/dba-team
          ln -sf $GITHUB_WORKSPACE /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner
          cp .pipeline_module_set_variables.sh module_set_variables.sh
          chown -R postgres:postgres $GITHUB_WORKSPACE
          chmod 777 -R $GITHUB_WORKSPACE

      - name: Run build
        run: |
          sudo -i -u postgres /builds/cheshire-datasystems/dba-team/pg-mv-fast-refresh-githubrunner/run_pipeline_checks.sh build

  mv-refresh:
    name: MV Refresh
    runs-on: ubuntu-latest
    container:
      image: postgres:17.6
      env:
        POSTGRES_HOST_AUTH_METHOD: trust
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get -q update
